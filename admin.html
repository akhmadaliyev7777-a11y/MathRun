<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel — Mathlearn</title>
<link rel="icon" href="favicon.png?v=3" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="stylesheet" href="css/style.css?v=65">
<link rel="stylesheet" href="css/admin.css?v=6">
</head>
<body hidden>

<div id="site-header-root"></div>

<div class="page-container wide">
  <div class="adm-head">
    <div>
      <h1 class="page-title" style="margin-bottom:6px">Admin panel</h1>
      <p class="muted" style="margin:0">Kontent holati, izohlaringiz va o'quvchilarning test natijalari.</p>
    </div>
    <a class="adm-head-link" href="index.html">Saytni ochish ↗</a>
  </div>

  <!-- bugungi ish va umumiy sonlar -->
  <div id="adm-stats"></div>

  <!-- ish maydoni: chapda sinf, o'ngda mavzular -->
  <section class="adm-work">
    <aside class="adm-side">
      <div class="adm-side-label">Sinflar</div>
      <div class="adm-grade-list" id="adm-grade-list"></div>
    </aside>

    <div class="adm-main">
      <div class="adm-main-head">
        <div>
          <h2 class="adm-main-title" id="adm-main-title"></h2>
          <div class="adm-progress" id="adm-progress"></div>
        </div>
        <input type="search" id="adm-search" class="adm-search" placeholder="Mavzuni qidirish…" autocomplete="off">
      </div>
      <div class="adm-filter" id="adm-filter" role="tablist"></div>
      <div class="adm-legend">
        <span><i class="adm-cell adm-cell--ok">✓</i>bor</span>
        <span><i class="adm-cell adm-cell--none">—</i>yo'q</span>
        <span><i class="adm-cell adm-cell--part">10</i>test eski formatda (20+20 emas)</span>
        <span><i class="adm-rev adm-rev--qizil"></i>tekshirilmagan</span>
        <span><i class="adm-rev adm-rev--sariq"></i>tasdiq kutilmoqda</span>
        <span class="muted" id="adm-legend-hint"></span>
      </div>
      <div id="adm-topics"></div>
    </div>
  </section>

  <!-- o'quvchilar natijalari (nomsiz) -->
  <section class="adm-results" id="adm-results"></section>

  <!-- kirgan o'quvchilar: ism va natijalari -->
  <section class="adm-results" id="adm-users"></section>
</div>

<!-- mavzu yon oynasi -->
<div class="adm-panel" id="adm-panel" hidden>
  <aside class="adm-panel-box" role="dialog" aria-modal="true" aria-labelledby="adm-panel-title">
    <div class="adm-panel-head">
      <div>
        <div class="adm-modal-kicker" id="adm-panel-kicker"></div>
        <div class="adm-modal-title" id="adm-panel-title"></div>
      </div>
      <button type="button" class="drawer-close" id="adm-panel-close" aria-label="Yopish">&times;</button>
    </div>
    <div id="adm-panel-body"></div>
  </aside>
</div>

<!-- yuklash oynasi -->
<div class="adm-modal" id="adm-modal" hidden>
  <div class="adm-modal-box" role="dialog" aria-modal="true" aria-labelledby="adm-modal-title">
    <div class="adm-modal-head">
      <div>
        <div class="adm-modal-kicker" id="adm-modal-kicker"></div>
        <div class="adm-modal-title" id="adm-modal-title"></div>
      </div>
      <button type="button" class="drawer-close" id="adm-modal-close" aria-label="Yopish">&times;</button>
    </div>
    <div class="adm-type-tabs" id="adm-type-tabs"></div>
    <label class="adm-drop" id="adm-drop">
      <input type="file" hidden id="adm-file">
      <span class="adm-drop-icon">⬆</span>
      <span><b>Faylni tanlang</b> yoki shu yerga tashlang</span>
      <span class="muted" id="adm-drop-hint"></span>
    </label>
    <div id="adm-result" hidden></div>
  </div>
</div>

<script src="js/data.js?v=146"></script>
<script src="js/quizzes.js?v=67"></script>
<script src="js/main.js?v=42"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=8"></script>
<script src="js/auth.js?v=9"></script>
<script src="js/layout.js?v=22"></script>
<script src="js/natija.js?v=4"></script>
<script src="js/admin.js?v=17"></script>
<script>guardAdminPage(function () { renderSiteHeader(); renderAdminDashboard(); });</script>
</body>
</html>
