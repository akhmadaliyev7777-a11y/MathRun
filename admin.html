      <div class="adm-me">

        <span class="adm-me-text"><b id="adm-me-name">Admin</b><small>Admin</small></span>
      </div>

  <main class="adm-main-col">
    <h1 class="adm-view-title" id="adm-view-title" hidden></h1>

    <!-- alohida bo'limlarning batafsil qismlari (faqat o'z bo'limida ko'rinadi) -->

    <div class="adm-msum" id="adm-res-sum" data-views="natijalar"></div>

    <!-- bosh panel: 4 ta son, tayyorlik grafigi, natijalar faolligi, bugungi ish, izohlar -->
    <section id="adm-dash" class="adm-sec">
      <div class="adm-kpis" id="adm-kpis" data-views="bosh"></div>

      <div class="adm-dash-grid">
        <div class="adm-dash-col">
          <div class="adm-card adm-chart-card" id="adm-ready" data-views="bosh mavzular"></div>
          <div class="adm-card adm-card--dark" id="adm-activity" data-views="bosh natijalar"></div>
        </div>
        <div class="adm-dash-col">

          <div class="adm-card" id="adm-notes" data-views="bosh"></div>

      </div>

    <section class="adm-card adm-kunlik" id="adm-kunlik" data-views="kunlik"></section>

    <section class="adm-card adm-work adm-sec" id="adm-work" data-views="bosh mavzular">
      <div class="adm-main-head">
        <div>
          <h2 class="adm-main-title" id="adm-main-title"></h2>

        </div>
        <div class="adm-work-tools">
          <label class="adm-select adm-select--box"><select id="adm-sort" aria-label="Tartib">

        <span class="muted" id="adm-legend-hint"></span>
      </div>
      <div id="adm-topics"></div>
      <div class="adm-totals" id="adm-totals"></div>
