<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiziqli tenglamalar</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f6f7fb; color:#1f2433; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:28px; padding:24px; min-height:100vh; }
  .panel { background:#fff; border-radius:16px; padding:24px; box-shadow:0 4px 16px rgba(31,36,51,.08); }
  h2 { margin:0 0 4px; font-size:1.1rem; }
  .hint { color:#6b7280; font-size:.85rem; margin-bottom:14px; }
  svg { display:block; margin:0 auto; }
  .readouts { display:flex; flex-direction:column; gap:12px; min-width:220px; }
  .readout { background:#eef0fb; border-radius:12px; padding:12px 16px; }
  .readout .label { font-size:.72rem; font-weight:700; color:#4f5bd5; text-transform:uppercase; letter-spacing:.03em; }
  .readout .value { font-size:1.3rem; font-weight:800; margin-top:2px; }
  .readout.balanced { background:#e6f7f4; }
  .readout.balanced .label, .readout.balanced .value { color:#16a394; }
  input[type=range] { width:100%; }
  .btn { margin-top:6px; padding:10px 18px; font-weight:700; font-family:inherit; font-size:.85rem; color:#3a44b0; background:#eef0fb; border:none; border-radius:10px; cursor:pointer; }
  .btn:hover { background:#e0e3f9; }
  .equation { font-family:ui-monospace,monospace; font-size:.85rem; color:#6b7280; margin-top:8px; }
</style>
</head>
<body>

<div class="panel">
  <h2>Chiziqli tenglamalar</h2>
  <div class="hint">Slayderni suring — bitta shaklning og'irligini o'zgartiring va tarozi qachon muvozanatga kelishini toping</div>
  <svg id="scale-svg" width="360" height="220" viewBox="0 0 360 220"></svg>
  <input type="range" id="weight-slider" min="0" max="15" value="0" step="1">
</div>

<div class="readouts">
  <div class="readout"><div class="label">Bitta shakl</div><div class="value" id="weight-value">0 kg</div></div>
  <div class="readout"><div class="label">Chap pallada</div><div class="value" id="left-value">0 kg</div></div>
  <div class="readout" id="right-readout"><div class="label">O'ng pallada (maqsad)</div><div class="value" id="right-value">0 kg</div></div>
  <div class="equation" id="equation"></div>
  <button class="btn" id="next-btn">Boshqa masala →</button>
</div>

<script>
const SHAPES = { triangle: "▲", circle: "●", square: "■", star: "★", hexagon: "⬢" };
const SHAPE_NAMES = { triangle: "uchburchak", circle: "doira", square: "kvadrat", star: "yulduzcha", hexagon: "oltiburchak" };

const TASKS = [
  { shape: "triangle", count: 2, known: 0, total: 10 },
  { shape: "circle", count: 3, known: 0, total: 12 },
  { shape: "square", count: 2, known: 4, total: 16 },
  { shape: "star", count: 3, known: 6, total: 21 },
  { shape: "hexagon", count: 4, known: 2, total: 22 }
];

let idx = 0;
const slider = document.getElementById("weight-slider");

function drawScale(task, w, balanced) {
  const icon = SHAPES[task.shape];
  const leftItems = Array.from({length: task.count}).map(() => icon).join(" ");
  const tilt = balanced ? 0 : (task.count * w + task.known > task.total ? -8 : 8);
  const svg = document.getElementById("scale-svg");
  svg.innerHTML =
    '<line x1="180" y1="20" x2="180" y2="60" stroke="#1f2433" stroke-width="4"/>' +
    '<g style="transform: rotate(' + tilt + 'deg); transform-origin: 180px 60px; transition: transform .2s ease;">' +
      '<line x1="60" y1="60" x2="300" y2="60" stroke="#1f2433" stroke-width="4"/>' +
      '<line x1="80" y1="60" x2="80" y2="110" stroke="#6b7280" stroke-width="2"/>' +
      '<line x1="280" y1="60" x2="280" y2="110" stroke="#6b7280" stroke-width="2"/>' +
      '<ellipse cx="80" cy="130" rx="70" ry="26" fill="#eef0fb" stroke="' + (balanced ? "#16a394" : "#4f5bd5") + '" stroke-width="2"/>' +
      '<ellipse cx="280" cy="130" rx="70" ry="26" fill="#eef0fb" stroke="' + (balanced ? "#16a394" : "#16a394") + '" stroke-width="2"/>' +
      '<text x="80" y="120" font-size="22" text-anchor="middle">' + leftItems + '</text>' +
      (task.known ? '<text x="80" y="145" font-size="13" text-anchor="middle" fill="#6b7280">+ ' + task.known + ' kg tosh</text>' : "") +
      '<text x="280" y="135" font-size="22" font-weight="700" text-anchor="middle" fill="#16a394">' + task.total + ' kg</text>' +
    '</g>' +
    '<polygon points="160,20 200,20 180,45" fill="#1f2433"/>';
}

function render() {
  const task = TASKS[idx];
  slider.value = 0;
  document.querySelector(".hint").textContent =
    "Slayderni suring — bitta " + SHAPE_NAMES[task.shape] + "ning og'irligini o'zgartirib, tarozini muvozanatga keltiring";
  update();
}

function update() {
  const task = TASKS[idx];
  const w = Number(slider.value);
  const left = task.count * w + task.known;
  const balanced = left === task.total;

  drawScale(task, w, balanced);
  document.getElementById("weight-value").textContent = w + " kg";
  document.getElementById("left-value").textContent = left + " kg";
  document.getElementById("right-value").textContent = task.total + " kg";

  const rightReadout = document.getElementById("right-readout");
  const leftReadout = document.getElementById("left-value").parentElement;
  if (balanced) {
    leftReadout.classList.add("balanced");
    rightReadout.classList.add("balanced");
  } else {
    leftReadout.classList.remove("balanced");
    rightReadout.classList.remove("balanced");
  }

  document.getElementById("equation").textContent = balanced
    ? task.count + " × " + w + (task.known ? " + " + task.known : "") + " = " + task.total + "  ✓ Muvozanatda!"
    : task.count + " × w" + (task.known ? " + " + task.known : "") + " = " + task.total;
}

slider.addEventListener("input", update);
document.getElementById("next-btn").addEventListener("click", function () {
  idx = (idx + 1) % TASKS.length;
  render();
});

render();
</script>
</body>
</html>
