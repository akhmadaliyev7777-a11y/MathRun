<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuz va hajmlar</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f6f7fb; color:#1f2433; display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center; gap:24px; padding:24px; min-height:100vh; }
  .panel { background:#fff; border-radius:16px; padding:22px; box-shadow:0 4px 16px rgba(31,36,51,.08); }
  h2 { margin:0 0 4px; font-size:1.1rem; }
  .hint { color:#6b7280; font-size:.85rem; margin-bottom:16px; max-width:260px; }
  .solid-list { display:flex; flex-direction:column; gap:8px; }
  .solid-btn { padding:10px 16px; text-align:left; font-weight:700; font-family:inherit; font-size:.9rem; color:#1f2433; background:#f6f7fb; border:2px solid #e5e7f0; border-radius:10px; cursor:pointer; }
  .solid-btn:hover { border-color:#4f5bd5; }
  .solid-btn.active { border-color:#4f5bd5; background:#eef0fb; color:#3a44b0; }
  .display-panel { min-width:340px; text-align:center; }
  .solid-title { font-weight:800; font-size:1.05rem; margin-bottom:6px; }
  .solid-desc { color:#6b7280; font-size:.85rem; margin-top:10px; }
  svg rect, svg polygon, svg circle, svg path { fill:#eef0fb; stroke:#4f5bd5; stroke-width:2; }
</style>
</head>
<body>

<div class="panel">
  <h2>Fazoviy shakllar</h2>
  <div class="hint">Shaklni tanlang — uning yoyilmasi (yig'ilmasi ochilgan holati) ko'rinadi</div>
  <div class="solid-list" id="solid-list"></div>
</div>

<div class="panel display-panel">
  <div class="solid-title" id="solid-title"></div>
  <svg id="net-svg" width="320" height="240" viewBox="0 0 320 240"></svg>
  <div class="solid-desc" id="solid-desc"></div>
</div>

<script>
const SOLIDS = {
  cube: { label: "Kub", desc: "6 ta teng kvadrat yoqdan iborat" },
  cuboid: { label: "To'g'ri burchakli parallelepiped", desc: "6 ta to'rtburchak yoq (qarama-qarshilari juft-juft teng)" },
  squarePyramid: { label: "Piramida", desc: "1 ta kvadrat asos + 4 ta uchburchak yon yoq" },
  triangularPrism: { label: "Uchburchakli prizma", desc: "2 ta uchburchak asos + 3 ta to'rtburchak yon yoq" },
  cylinder: { label: "Silindr", desc: "2 ta doira asos + 1 ta egri yon sirt" },
  cone: { label: "Konus", desc: "1 ta doira asos + 1 ta sektor shaklidagi yon sirt" }
};

function netSvg(kind) {
  switch (kind) {
    case "cube":
      return '<rect x="88" y="40" width="48" height="48"/>' +
             '<rect x="40" y="88" width="48" height="48"/>' +
             '<rect x="88" y="88" width="48" height="48"/>' +
             '<rect x="136" y="88" width="48" height="48"/>' +
             '<rect x="184" y="88" width="48" height="48"/>' +
             '<rect x="88" y="136" width="48" height="48"/>';
    case "cuboid":
      return '<rect x="56" y="44" width="64" height="36"/>' +
             '<rect x="20" y="80" width="36" height="40"/>' +
             '<rect x="56" y="80" width="64" height="40"/>' +
             '<rect x="120" y="80" width="36" height="40"/>' +
             '<rect x="156" y="80" width="64" height="40"/>' +
             '<rect x="56" y="120" width="64" height="36"/>';
    case "squarePyramid":
      return '<rect x="100" y="90" width="56" height="56"/>' +
             '<polygon points="100,90 156,90 128,50"/>' +
             '<polygon points="100,146 156,146 128,186"/>' +
             '<polygon points="100,90 100,146 64,118"/>' +
             '<polygon points="156,90 156,146 192,118"/>';
    case "triangularPrism":
      return '<rect x="80" y="60" width="36" height="80"/>' +
             '<rect x="116" y="60" width="36" height="80"/>' +
             '<rect x="152" y="60" width="36" height="80"/>' +
             '<polygon points="80,60 80,140 40,100"/>' +
             '<polygon points="188,60 188,140 228,100"/>';
    case "cylinder":
      return '<circle cx="160" cy="50" r="30"/>' +
             '<rect x="66" y="90" width="188" height="70"/>' +
             '<circle cx="160" cy="190" r="30"/>';
    case "cone":
      return '<circle cx="80" cy="170" r="30"/>' +
             '<path d="M 220 80 L 300 40 A 110 110 0 0 1 300 170 Z"/>';
  }
}

let active = "cube";

function render() {
  const list = document.getElementById("solid-list");
  list.innerHTML = Object.keys(SOLIDS).map(function (k) {
    return '<button class="solid-btn' + (k === active ? " active" : "") + '" data-k="' + k + '">' + SOLIDS[k].label + '</button>';
  }).join("");
  list.querySelectorAll(".solid-btn").forEach(function (btn) {
    btn.addEventListener("click", function () { active = btn.dataset.k; render(); });
  });

  document.getElementById("solid-title").textContent = SOLIDS[active].label + " — yoyilmasi";
  document.getElementById("net-svg").innerHTML = netSvg(active);
  document.getElementById("solid-desc").textContent = SOLIDS[active].desc;
}

render();
</script>
</body>
</html>
