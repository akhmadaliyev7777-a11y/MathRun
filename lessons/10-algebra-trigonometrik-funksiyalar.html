<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinus va kosinus — birlik aylana</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6f7fb;
    color: #1f2433;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 24px;
    min-height: 100vh;
  }
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(31,36,51,0.08);
  }
  h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .hint { color: #6b7280; font-size: 0.85rem; margin-bottom: 12px; }
  svg { touch-action: none; cursor: grab; }
  #handle { cursor: grab; }
  #handle:active { cursor: grabbing; }
  .readouts { display: flex; flex-direction: column; gap: 14px; min-width: 220px; }
  .readout {
    background: #eef0fb;
    border-radius: 12px;
    padding: 14px 18px;
  }
  .readout .label { font-size: 0.78rem; font-weight: 700; color: #4f5bd5; text-transform: uppercase; letter-spacing: 0.04em; }
  .readout .value { font-size: 1.6rem; font-weight: 800; margin-top: 4px; }
  .readout.cos .label { color: #16a394; }
  input[type=range] { width: 100%; margin-top: 6px; }
</style>
</head>
<body>

<div class="panel">
  <h2>Birlik aylana</h2>
  <div class="hint">Nuqtani sudrab burchakni o'zgartiring, yoki pastdagi slayderdan foydalaning</div>
  <svg id="circle-svg" width="320" height="320" viewBox="0 0 320 320">
    <line x1="20" y1="160" x2="300" y2="160" stroke="#e5e7f0" stroke-width="2" />
    <line x1="160" y1="20" x2="160" y2="300" stroke="#e5e7f0" stroke-width="2" />
    <circle cx="160" cy="160" r="120" fill="none" stroke="#4f5bd5" stroke-width="2" />
    <line id="cos-line" x1="160" y1="160" x2="280" y2="160" stroke="#16a394" stroke-width="3" />
    <line id="sin-line" x1="280" y1="160" x2="280" y2="160" stroke="#4f5bd5" stroke-width="3" />
    <line id="radius-line" x1="160" y1="160" x2="280" y2="160" stroke="#1f2433" stroke-width="2" />
    <circle id="handle" cx="280" cy="160" r="10" fill="#1f2433" />
  </svg>
  <input type="range" id="angle-slider" min="0" max="360" value="0" step="1">
</div>

<div class="readouts">
  <div class="readout">
    <div class="label">Burchak</div>
    <div class="value" id="angle-value">0°</div>
  </div>
  <div class="readout">
    <div class="label">sin(burchak)</div>
    <div class="value" id="sin-value">0.00</div>
  </div>
  <div class="readout cos">
    <div class="label">cos(burchak)</div>
    <div class="value" id="cos-value">1.00</div>
  </div>
</div>

<script>
  const cx = 160, cy = 160, r = 120;
  const svg = document.getElementById("circle-svg");
  const handle = document.getElementById("handle");
  const radiusLine = document.getElementById("radius-line");
  const sinLine = document.getElementById("sin-line");
  const cosLine = document.getElementById("cos-line");
  const slider = document.getElementById("angle-slider");
  const angleValue = document.getElementById("angle-value");
  const sinValue = document.getElementById("sin-value");
  const cosValue = document.getElementById("cos-value");

  let angleDeg = 0;

  function setAngle(deg) {
    angleDeg = ((deg % 360) + 360) % 360;
    const rad = angleDeg * Math.PI / 180;
    const x = cx + r * Math.cos(rad);
    const y = cy - r * Math.sin(rad);

    handle.setAttribute("cx", x);
    handle.setAttribute("cy", y);
    radiusLine.setAttribute("x2", x);
    radiusLine.setAttribute("y2", y);

    cosLine.setAttribute("x1", cx);
    cosLine.setAttribute("y1", cy);
    cosLine.setAttribute("x2", x);
    cosLine.setAttribute("y2", cy);

    sinLine.setAttribute("x1", x);
    sinLine.setAttribute("y1", cy);
    sinLine.setAttribute("x2", x);
    sinLine.setAttribute("y2", y);

    angleValue.textContent = Math.round(angleDeg) + "°";
    sinValue.textContent = Math.sin(rad).toFixed(2);
    cosValue.textContent = Math.cos(rad).toFixed(2);
    slider.value = angleDeg;
  }

  slider.addEventListener("input", function () {
    setAngle(Number(slider.value));
  });

  let dragging = false;
  function angleFromPointer(evt) {
    const rect = svg.getBoundingClientRect();
    const px = evt.clientX - rect.left - cx;
    const py = evt.clientY - rect.top - cy;
    return Math.atan2(-py, px) * 180 / Math.PI;
  }

  handle.addEventListener("pointerdown", function (evt) {
    dragging = true;
    handle.setPointerCapture(evt.pointerId);
  });
  handle.addEventListener("pointermove", function (evt) {
    if (!dragging) return;
    setAngle(angleFromPointer(evt));
  });
  handle.addEventListener("pointerup", function () { dragging = false; });

  setAngle(0);
</script>

</body>
</html>
