<!doctype html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modul kasblarda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Modul kasblarda: o'quvchi kasb tanlaydi va |x − a| ≤ d qoidasini ish ichida topadi.
   Ranglar: me'yor (a) — to'q sariq, ruxsat etilgan oraliq — yashil, tashqarisi — qizil, o'quvchi nuqtasi — ko'k. */
:root{
  color-scheme:light;
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6577; --line:#D5DBE5; --soft:#F5F7FA;
  --blue:#1F5FD6; --bluebg:#E3ECFC; --green:#12805C; --greenbg:#DDF3E9; --red:#C62828; --redbg:#FBE3E3;
  --orange:#D4501B; --orangebg:#FDEBE2; --amber:#B7791F; --amberbg:#FFF4E5; --violet:#6D4BD8; --violetbg:#EEE9FC;
  --gold:#E3A008;
  --f-display:"Bricolage Grotesque",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:18px 16px 36px;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
[hidden]{display:none!important}
button{font-family:inherit;touch-action:manipulation}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:800 clamp(26px,5.6vw,38px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
h2{font:800 clamp(19px,4.4vw,23px)/1.25 var(--f-display);margin:0}
p{margin:0}
.sub{color:var(--muted);margin-top:6px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:480px){.panel{padding:14px}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:46px;padding:10px 18px;border-radius:12px;border:0;background:var(--ink);color:#fff;font:800 16px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(18,128,92,.18)}}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.fx{font:800 1.05em var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{color:var(--muted);font-size:15px;font-weight:600}
.task{font-weight:700}
.cg{color:var(--green)}.cr{color:var(--red)}.co{color:var(--orange)}.cb{color:var(--blue)}.cv{color:var(--violet)}
.fb{font-weight:700;border-radius:12px;padding:10px 14px;line-height:1.45}
.fb:empty{display:none}
.fb.ok{background:var(--greenbg);color:#0B5E43}
.fb.bad{background:var(--redbg);color:#9B1C1C}
.fb.hint{background:var(--amberbg);color:#7A4E07}
.fb.info{background:var(--bluebg);color:#173F8F}
.rule{border-left:5px solid var(--green);background:var(--greenbg);border-radius:10px;padding:10px 14px;font-weight:600;color:var(--ink);line-height:1.9}
.rule .fx{font-size:1.1em;display:inline-block;background:#fff;border-radius:7px;padding:0 6px;line-height:1.5}
.rule .lx{font-style:normal;font-weight:800}
.lx-x{color:var(--blue)}.lx-a{color:var(--orange)}.lx-d{color:#0B6E4F}
/* son o'qi */
.nlbox{width:100%;min-width:0;user-select:none;-webkit-user-select:none}
.nlbox svg{display:block;max-width:100%}
.nlbox.drag{touch-action:none;cursor:pointer}
.nlbox.tap{cursor:pointer}
.nl text{font-family:var(--f-body)}
.tl{font:700 13px var(--f-body);fill:var(--muted);text-anchor:middle}
.ml{font:800 14px var(--f-display);text-anchor:middle}
.al{font:800 13px var(--f-display);text-anchor:middle}
/* kirish */
.ro{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
@media (max-width:420px){.ro{grid-template-columns:1fr 1fr}.ro .rc:last-child{grid-column:1/-1}}
.rc{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:84px}
.rc small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.rc b{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.goal{border-radius:12px;padding:10px 14px;background:var(--amberbg);color:#6B4506;font-weight:700;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.goal.ok{background:var(--greenbg);color:#0B5E43}
.gs{display:inline-grid;place-items:center;min-width:40px;height:34px;padding:0 8px;border-radius:9px;border:2px dashed currentColor;font:800 18px var(--f-display)}
.gs.on{border-style:solid;background:#fff}
/* kasb tanlash */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;color:var(--ink);min-height:96px;position:relative}
.kcard:hover{border-color:var(--muted)}
.kcard .av{flex:none}
.ktx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ktx b{font:800 19px var(--f-display)}
.ktx span{color:var(--muted);font-size:14px;font-weight:600;line-height:1.35}
.ktx em{font-style:normal;font-size:12.5px;font-weight:800;color:var(--violet);background:var(--violetbg);border-radius:99px;padding:2px 9px;align-self:flex-start;margin-top:4px}
.kst{position:absolute;top:10px;right:12px;display:flex;gap:4px}
.kst i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.kst i.on{background:var(--green)}
.kcard.done{border-color:#9BD3BD;background:linear-gradient(180deg,#F3FBF7,#fff)}
.kdone{position:absolute;right:10px;bottom:8px;font:800 12px var(--f-body);color:var(--green)}
.kcard.fin{border-style:dashed;border-color:#E9C46A;background:#FFFBEF}
.fin-ic{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF1B8,#F2B705);border:3px solid #D69E00;font:800 13px var(--f-display);color:#5A3D00}
/* kasb sahifasi */
.ktop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kname{display:flex;align-items:center;gap:10px;min-width:0}
@media (max-width:480px){.kname .av{display:none}.kname b{font-size:18px}.ktop{flex-wrap:nowrap}.ktop .btn{flex:none;padding:10px 12px}}
.kname b{display:block;font:800 20px var(--f-display);line-height:1.15}
.kname small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.stabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stab{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:800 15px var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px}
.stab b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:13px}
.stab[aria-selected="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.stab[aria-selected="true"] b{background:var(--ink);color:#fff}
.stab.done b{background:var(--green);color:#fff}
.stab:disabled{opacity:.45;cursor:default}
@media (max-width:420px){.stab{font-size:13.5px;gap:5px;padding:4px}.stab b{width:21px;height:21px;font-size:12px}}
@media (max-width:350px){.stab{font-size:12.5px;gap:3px}}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .av{flex:none}
.btext{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px 10px;min-width:0;flex:1}
.btext::before{content:"";position:absolute;left:-8px;top:16px;width:14px;height:14px;background:var(--surface);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.btext small{display:block;color:var(--muted);font-weight:800;font-size:12.5px}
.btext p{font-weight:700;line-height:1.45}
.btext p.flash{animation:fl .5s ease}
@keyframes fl{from{opacity:.2}to{opacity:1}}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.count{font:800 14px var(--f-body);color:var(--muted);white-space:nowrap}
.sbox{display:flex;flex-direction:column;gap:14px;min-width:0}
.donebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--greenbg);border-radius:14px;padding:12px 14px}
.donebar>span{font:800 17px var(--f-display);color:#0B5E43}
.medalrow{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF8DD,#F3FBF7);border:1.5px solid #E9C46A;border-radius:16px;padding:14px}
.medalrow b{font:800 19px var(--f-display);display:block}
.medalrow p{font-weight:600}
.medal{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF1B8,#F2B705);border:3px solid #D69E00;box-shadow:0 4px 12px rgba(180,120,0,.25)}
/* savollar */
.ask{display:flex;flex-direction:column;gap:10px}
.q{font-weight:800;font-size:17px;line-height:1.4}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{min-height:48px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px/1.35 var(--f-body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.ok{border-color:var(--green);background:var(--greenbg);color:#0B5E43}
.opt.bad{border-color:var(--red);background:var(--redbg);color:#9B1C1C}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.tline,.nline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:800 clamp(22px,5.6vw,30px)/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.tk{padding:0 1px}
.slot{min-width:64px;height:52px;border-radius:12px;border:2px dashed var(--muted);background:var(--soft);font:800 22px var(--f-display);color:var(--ink);cursor:pointer;padding:0 8px}
.slot.full{border-style:solid;border-color:var(--blue);background:var(--bluebg)}
.slot.ok{border-color:var(--green);background:var(--greenbg)}
.slot.bad{border-color:var(--red);background:var(--redbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-width:56px;height:50px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:800 21px var(--f-display);color:var(--ink);cursor:pointer;padding:0 10px;box-shadow:0 3px 0 var(--ink)}
.tile:disabled{opacity:.25;cursor:default;box-shadow:none}
.ni{width:92px;height:52px;border-radius:12px;border:2px solid var(--muted);font:800 22px var(--f-display);text-align:center;color:var(--ink);background:#fff;padding:0 4px}
.ni.ok{border-color:var(--green);background:var(--greenbg)}
.ni.bad{border-color:var(--red);background:var(--redbg)}
.sg{min-width:52px;height:52px;border-radius:12px;border:2px solid var(--violet);background:var(--violetbg);color:var(--violet);font:800 24px var(--f-display);cursor:pointer}
.sg.ok{border-color:var(--green);background:var(--greenbg);color:var(--green)}
.sg.bad{border-color:var(--red);background:var(--redbg);color:var(--red)}
.nlab{font:800 16px var(--f-body);color:var(--muted)}
.judge{display:flex;flex-direction:column;gap:10px}
.jrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.jrow .fb{grid-column:1/-1}
.jq{font-weight:800;font-size:17px}
.jbtn{display:flex;gap:8px}
.jbtn .btn{padding:8px 12px;font-size:15px}
@media (max-width:520px){.jrow{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;min-width:64px;border-radius:12px;border:2px solid var(--line);background:#fff;font:800 16px var(--f-display);color:var(--ink);cursor:pointer;padding:4px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.chip small{font:700 12px var(--f-body);color:var(--muted)}
.chip.on{border-color:var(--violet);background:var(--violetbg)}
.chip.ok{border-color:var(--green);background:var(--greenbg)}
.chip.bad{border-color:var(--red);background:var(--redbg)}
.chip:disabled{cursor:default}
.dlist{display:flex;flex-wrap:wrap;gap:6px 14px;font:800 16px var(--f-display);font-variant-numeric:tabular-nums}
/* shifokor */
.pcard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.pwho{display:flex;align-items:center;gap:12px;min-width:0}
.pwho b{font:800 20px var(--f-display)}
.pwho small{color:var(--muted);font-weight:700}
.reading{font:800 30px var(--f-display);font-variant-numeric:tabular-nums;color:#B71C1C;line-height:1.1}
/* tikuvchi */
.cust{display:flex;gap:10px;align-items:center;background:var(--amberbg);border-radius:14px;padding:8px 12px}
.cust .av{flex:none}
.cust p{font-weight:700}
/* quruvchi */
.conv{position:relative;user-select:none;-webkit-user-select:none}
.belt{height:84px;border-radius:14px;background:repeating-linear-gradient(90deg,#4B5563 0 18px,#3F4752 18px 36px);border:4px solid #2B3038;position:relative;overflow:hidden}
.belt.run{animation:beltmv .6s linear infinite}
@keyframes beltmv{to{background-position:36px 0}}
.bnorm{font:800 14px var(--f-body);color:var(--muted);margin:0 0 6px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bin{min-height:84px;border-radius:14px;border:3px dashed;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 19px var(--f-display)}
.bin small{font:700 12px var(--f-body);opacity:.75}
.bin.good{border-color:var(--green);background:var(--greenbg);color:#0B5E43}
.bin.bad{border-color:var(--red);background:var(--redbg);color:#9B1C1C}
.brick{position:absolute;left:0;top:0;width:96px;height:52px;border-radius:7px;background:linear-gradient(180deg,#D7663F,#B9472A);border:2px solid #8E3218;color:#fff;display:flex;align-items:baseline;justify-content:center;gap:3px;padding-top:9px;cursor:grab;touch-action:none;box-shadow:0 3px 0 #7A2A14;z-index:3}
.brick b{font:800 24px var(--f-display)}
.brick small{font-weight:800;font-size:12px;opacity:.85}
.brick.drag{cursor:grabbing;box-shadow:0 10px 20px rgba(0,0,0,.25)}
.score{font-weight:700;color:var(--muted)}
.score b{font-weight:800}
.log{display:flex;flex-wrap:wrap;gap:6px}
.lg{font:800 14px var(--f-display);border-radius:8px;padding:3px 9px}
.lg.ok{background:var(--greenbg);color:#0B5E43}
.lg.bad{background:var(--redbg);color:#9B1C1C}
.lg.miss{background:#ECEFF3;color:var(--muted)}
/* oshpaz */
.oven{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px}
.temp{font:800 20px var(--f-display);color:var(--muted)}
.temp b{font-size:42px;color:var(--ink);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:800 13px var(--f-body);border-radius:99px;padding:3px 11px;color:#fff;background:var(--green)}
.pill.hi{background:var(--red)}.pill.lo{background:var(--blue)}
.clock{font-weight:700;color:var(--muted);margin-top:4px}
.ev{font-weight:800;color:var(--orange);min-height:1.5em}
.ovctrl{display:flex;flex-direction:column;align-items:center;gap:6px}
.knob{width:110px;height:110px;touch-action:none;cursor:grab}
.ovctrl .row{gap:6px;flex-wrap:nowrap}
.ovctrl .btn{width:48px;padding:0;font-size:24px}
.pw{font:800 14px var(--f-body);min-width:74px;text-align:center}
@media (max-width:600px){.oven{grid-template-columns:auto 1fr}.ovctrl{grid-column:1/-1;flex-direction:row;justify-content:center;gap:16px}.ovsvg{width:96px;height:88px}}
/* dasturchi */
.gm{border-radius:12px;overflow:hidden}
.code{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#1E2235;color:#E6E9F5;border-radius:14px;padding:12px 14px;font:700 19px var(--f-code)}
.code .kw{color:#C792EA}
.code .str{color:#C3E88D}
.code.bug{box-shadow:inset 0 0 0 3px var(--red)}
.code.fixed{box-shadow:inset 0 0 0 3px #3DDC97}
.stp{display:inline-flex;align-items:center;background:#2C3150;border-radius:12px;overflow:hidden}
.sb{width:44px;height:46px;border:0;background:#3A4068;color:#fff;font:800 22px var(--f-body);cursor:pointer}
.si{width:64px;height:46px;border:0;background:#fff;color:var(--ink);text-align:center;font:800 20px var(--f-code)}
.cg1{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
@media (max-width:420px){.code{font-size:17px;gap:8px 10px;padding:10px 12px}.sb{width:42px}.si{width:54px}}
.zone{font-weight:700}
.zone b{font:800 18px var(--f-display);color:var(--green)}
.gstat{min-height:1.5em}
.btn.sm{min-height:40px;padding:7px 13px;font-size:14.5px}
.kctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:-4px}
.btn.help{background:var(--amberbg);color:#7A4E07;border:1.5px solid #E9C46A}
.btn.help.pulse{animation:hpulse 1.6s ease-in-out infinite}
@keyframes hpulse{50%{box-shadow:0 0 0 7px rgba(227,160,8,.3)}}
/* vaziyat kartasi */
.scene{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
@media (max-width:640px){.scene{grid-template-columns:1fr}.scimg{aspect-ratio:2/1}}
.scimg{aspect-ratio:16/9;background:#E8EEFA;min-width:0}
.scimg img{width:100%;height:100%;object-fit:cover;display:block}
.scfb{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:12px 12px 0}
.scfb .av{align-self:center}
.sctx{padding:14px 18px;display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.sctx b{font:800 20px/1.2 var(--f-display)}
.sctx p{font-weight:600;line-height:1.5}
.sctx p.flash{animation:fl .5s ease}
/* formula paneli */
.kbody{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){.kbody{display:grid;grid-template-columns:minmax(0,1fr) 270px;align-items:start}.kbody>.fpan{order:2}}
.fpan{background:#FFFCF3;border:1.5px solid #E9C46A;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fpan h3{margin:0;font:800 13px var(--f-body);color:var(--amber);text-transform:uppercase;letter-spacing:.05em}
.ff{font:800 25px/1.25 var(--f-display);font-variant-numeric:tabular-nums}
.ff.cr{color:var(--red)}
.fe{font:800 18px/1.4 var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.fo{font:700 14px var(--f-body);color:var(--muted)}
.fl{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;font-weight:700;color:var(--muted)}
@media (min-width:900px){.fl{flex-direction:column}}
.fl b{font:800 15px var(--f-display)}
.fnote{font-size:14px;font-weight:700;color:var(--muted)}
.hole{display:inline-block;min-width:1.3em;padding:0 3px;border:2px dashed var(--muted);border-radius:7px;color:var(--muted);text-align:center;line-height:1.1}
.fn{border-top:1.5px dashed var(--line);padding-top:8px;font:800 18px/1.35 var(--f-display);font-variant-numeric:tabular-nums}
.fn small{display:block;font:700 13px var(--f-body);color:var(--muted)}
.fr{display:inline-block;margin-top:5px;font:800 14px var(--f-body);border-radius:99px;padding:3px 11px}
.fr.ok{background:var(--greenbg);color:#0B5E43}.fr.bad{background:var(--redbg);color:#9B1C1C}
/* ma'ruza: 5 kasb, qadamma-qadam ishlangan misol */
.ltabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ltab{min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:800 14.5px var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;position:relative;min-width:0}
.ltab[aria-selected="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.ltab.done::after{content:"✓";position:absolute;top:2px;right:6px;font:800 13px var(--f-body);color:var(--green)}
@media (max-width:700px){.ltab{flex-direction:column;gap:2px;font-size:11.5px;padding:5px 2px}.ltab .av{width:30px;height:30px}}
.ltag{display:block;color:var(--violet);font:800 12.5px var(--f-body);text-transform:uppercase;letter-spacing:.04em}
.lex{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:760px){.lex{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.lvis{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lart{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;min-height:110px}
.lnow{border-top:1.5px dashed var(--line);padding-top:8px;text-align:center;font:800 20px/1.45 var(--f-display);font-variant-numeric:tabular-nums;min-height:2.3em}
.lnow.flash{animation:fl .5s ease}
.lnow .fr{margin-left:6px;vertical-align:middle}
.lsteps{display:flex;flex-direction:column;gap:12px;min-width:0}
.lol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lol li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:600;line-height:1.5;animation:lin .45s ease both}
.lol li>i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--muted);font:800 14px var(--f-display)}
.lol li.cur{border-color:#9DB8EE;background:#F2F6FE}
.lol li.cur>i{background:var(--blue);color:#fff}
@keyframes lin{from{opacity:0;transform:translateY(10px)}}
.lpat{display:flex;align-items:center;gap:12px}
.lpat b{font:800 19px var(--f-display);display:block}
.lpat small{color:var(--muted);font-weight:700}
.lcard{background:#fff;border:1.5px dashed var(--line);border-radius:14px;padding:8px 14px;transition:border-color .3s,background .3s}
.lcard small{display:block;color:var(--muted);font-weight:800;font-size:12.5px}
.lcard.lok{border-style:solid;border-color:var(--green);background:var(--greenbg)}
.lpop{display:inline-block;animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.lbrick{width:124px;height:54px;border-radius:7px;background:linear-gradient(180deg,#D7663F,#B9472A);border:2px solid #8E3218;color:#fff;display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:9px;box-shadow:0 3px 0 #7A2A14;font-weight:800}
.lbrick b{font:800 25px var(--f-display)}
.lbrick.in{animation:slin .6s ease}
@keyframes slin{from{transform:translateX(-70px);opacity:0}}
.lcons{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.lcon{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lcon small{color:var(--muted);font-weight:800;font-size:12.5px}

.lcon.bad{border-color:var(--red);background:var(--redbg)}.lcon.bad em{color:#9B1C1C}
.ldisp{display:flex;align-items:center;gap:16px;background:#1E2235;color:#E6E9F5;border-radius:14px;padding:10px 18px}
.ldisp small{display:block;font-weight:700;font-size:13px;color:#AEB6D3}
.ldisp b{font:800 34px var(--f-display);font-variant-numeric:tabular-nums}
.lsig{display:flex;flex-direction:column;align-items:center;gap:3px;font:800 13px var(--f-body)}
.lamp{width:30px;height:30px;border-radius:50%;background:#4B5563;border:3px solid #374151}
.lamp.on{background:#EF4444;border-color:#FCA5A5;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{background:#7F1D1D}}
.lart .code{width:100%;justify-content:center}
.lart .code .cf{white-space:nowrap}
@media (max-width:420px){.lart .code{font-size:14.5px;gap:6px;flex-wrap:nowrap}}

.lgo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,#F3FBF7,#FFF8DD);border:1.5px solid #9BD3BD;border-radius:16px;padding:14px}
.lgo>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.lgo b{font:800 20px var(--f-display)}

.lgo-av{display:flex}.lgo-av .av{margin-right:-8px;border:2px solid #fff;border-radius:50%}
@media (max-width:480px){.lgo .btn{width:100%}}

.bands{display:flex;flex-direction:column;gap:6px}
.brow{border:1px solid var(--line);border-radius:12px;padding:8px 10px 0}

<body>
<div class="wrap">
  <header>
    <h1>Modul kasblarda</h1>
    <p class="sub">Har bir kasbda o'lchov me'yordan biroz farq qiladi. Qancha farq mumkin — buni modul aytadi.</p>
  </header>
  <main id="scr" class="wrap" style="max-width:none;width:100%"></main>
</div>

<script>
"use strict";
/* ============ umumiy yordamchilar ============ */
const C = { ink:"#14213D", muted:"#5B6577", line:"#D5DBE5", blue:"#1F5FD6", green:"#12805C", red:"#C62828", orange:"#D4501B", amber:"#B7791F", violet:"#6D4BD8", soft:"#F5F7FA" };
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r6 = v => Math.round(v * 1e6) / 1e6;
const snap = (v, s) => r6(Math.round(v / s) * s);
const same = (a, b) => Math.abs(a - b) < 1e-6;
const dist = (x, a) => r6(Math.abs(x - a));
function fmt(v) { const r = Math.round(v * 1000) / 1000; return (r < 0 ? "−" : "") + String(Math.abs(r)).replace(".", ","); }
function fmt1(v) { return v.toFixed(1).replace(".", ","); }
function num(s) {
  s = String(s).trim().replace(/\s/g, "").replace(",", ".").replace(/[−–]/g, "-");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
const M = "−";
let UID = 0;

/* saqlash (faqat shu brauzerda) */
const KEY = "mathlearn-modul-kasblar-v1";
function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && typeof v === "object") return { intro: v.intro || 0, k: v.k || {}, fin: v.fin || null, ls: Array.isArray(v.ls) ? v.ls : [] }; } catch (e) {}
  return { intro: 0, k: {}, fin: null, ls: [] };
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const stageOf = id => S.k[id] || 0;
function setStage(id, n) { if (n > stageOf(id)) { S.k[id] = n; save(); } }

/* tozalash: taymerlar, animatsiyalar */
let CLEAN = [];
function onLeave(fn) { CLEAN.push(fn); }
function leaveAll() { CLEAN.forEach(f => { try { f(); } catch (e) {} }); CLEAN = []; }
function later(fn, ms) { const id = setTimeout(fn, ms); onLeave(() => clearTimeout(id)); return id; }

/* oyna balandligi — mavzu sahifasidagi iframe ichki aylanmasin */
function post() { try { parent.postMessage({ type: "mathrun:height", h: Math.ceil(document.body.getBoundingClientRect().height) }, "*"); } catch (e) {} }
new ResizeObserver(post).observe(document.body);

/* element ko'rinmasa — unga suriladi (mavzu sahifasi ichida ham) */
function scrollToEl(el) {
  try {
    const fe = window.frameElement;
    if (fe && window.parent !== window) {
      const P = window.parent, pd = P.document;
      const nav = pd.getElementById("topic-steps"), hdr = pd.querySelector(".site-header--sticky");
      const off = 8 + Math.max(0, nav ? nav.getBoundingClientRect().bottom : 0, hdr ? hdr.getBoundingClientRect().bottom : 0);
      const top = fe.getBoundingClientRect().top + el.getBoundingClientRect().top;
      if (top < off || top > P.innerHeight * 0.6) P.scrollBy({ top: top - off, behavior: "smooth" });
      return;
    }
  } catch (e) {}
  const top = el.getBoundingClientRect().top;
  if (top < 0 || top > innerHeight * 0.6) scrollBy({ top: top - 8, behavior: "smooth" });
}

/* o'lchami o'zgarganda qayta chiziladigan chizmalar */
const LIVE = new Set();
let rzT = 0;
window.addEventListener("resize", () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => { LIVE.forEach(o => { if (!document.body.contains(o.el)) LIVE.delete(o); else o.draw(); }); }, 80);
});

/* ============ personajlar (oddiy SVG) ============ */
const BODY = "M8 68C8 51 19 44 32 44s24 7 24 24z";
function avatar(k, size) {
  const id = "av" + (++UID);
  const P = typeof k === "object" ? k : ({
    shifokor: { bg: "#DCEBFF", body: "#FFFFFF", hair: "#3A2A1E" },
    tikuvchi: { bg: "#FCE4EE", body: "#D23B77", hair: "#5A3825", long: 1 },
    quruvchi: { bg: "#FFEFD2", body: "#F57C00", hair: "#2E2E2E" },
    oshpaz: { bg: "#E2F3E7", body: "#FFFFFF", hair: "#2E2E2E" },
    dasturchi: { bg: "#ECE6FA", body: "#5E35B1", hair: "#1E1E1E", long: 1 }
  })[k];
  const kind = typeof k === "string" ? k : "";
  const back = P.long ? `<path d="M19.5 31c-1.2-11 4.8-18 12.5-18s13.7 7 12.5 18l1 14h-27z" fill="${P.hair}"/>` : "";
  const front = `<path d="M21 28c-.6-8.6 4.6-14 11-14s11.6 5.4 11 14c-1.6-4.6-5.6-7.4-11-7.4S22.6 23.4 21 28z" fill="${P.hair}"/>`;
  const white = P.body === "#FFFFFF" ? ` stroke="#CBD5E1" stroke-width="1.2"` : "";
  let outfit = "", top = "";
  if (kind === "shifokor") {
    outfit = `<path d="M26.5 44.5 32 54l5.5-9.5z" fill="#7FB2F0"/><path d="M25 44.8 32 56 39 44.8" fill="none" stroke="#CBD5E1" stroke-width="1.4"/>
      <path d="M24.5 45.5c-2.5 7 0 12.5 4.5 13.5M39.5 45.5c2.5 7 0 12.5-4.5 13.5" fill="none" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
      <circle cx="32" cy="59.5" r="2.8" fill="#B0BEC5" stroke="#37474F" stroke-width="1.4"/>
      <rect x="43.5" y="50" width="7" height="7" rx="1.5" fill="#fff" stroke="#CBD5E1"/><path d="M47 51.3v4.4M44.8 53.5h4.4" stroke="#E53935" stroke-width="1.6"/>`;
  } else if (kind === "tikuvchi") {
    outfit = `<path d="M25 43.5c-1 7-2.5 13-3.8 21M39 43.5c1 7 2.5 13 3.8 21" stroke="#F4C430" stroke-width="5" fill="none"/>
      <path d="M25 43.5c-1 7-2.5 13-3.8 21M39 43.5c1 7 2.5 13 3.8 21" stroke="#7A5B00" stroke-width="5" stroke-dasharray="0.8 2.6" fill="none" opacity=".45"/>`;
  } else if (kind === "quruvchi") {
    outfit = `<path d="M27 44.5 32 51l5-6.5z" fill="#455A64"/><g clip-path="url(#${id}b)"><path d="M0 52h64M0 58h64" stroke="#FFF176" stroke-width="2.6"/></g>`;
    top = `<path d="M19.5 23.5a12.5 11 0 0 1 25 0z" fill="#FFC107"/><path d="M32 13v10" stroke="#FFE082" stroke-width="3"/><rect x="16" y="21.5" width="32" height="4" rx="2" fill="#FFA000"/>`;
  } else if (kind === "oshpaz") {
    outfit = `<path d="M26.5 43.5 32 50.5l5.5-7z" fill="#E53935"/><g fill="#90A4AE"><circle cx="27" cy="54" r="1.3"/><circle cx="27" cy="60" r="1.3"/><circle cx="37" cy="54" r="1.3"/><circle cx="37" cy="60" r="1.3"/></g>`;
    top = `<g fill="#fff" stroke="#CBD5E1" stroke-width="1.2"><circle cx="24.5" cy="12.5" r="5.6"/><circle cx="39.5" cy="12.5" r="5.6"/><circle cx="32" cy="9.5" r="6.8"/></g><path d="M22.5 13h19v6h-19z" fill="#fff"/><rect x="21.5" y="17" width="21" height="5.5" rx="1.5" fill="#fff" stroke="#CBD5E1" stroke-width="1.2"/>`;
  } else if (kind === "dasturchi") {
    outfit = `<path d="M21.5 45.5q10.5 7 21 0" fill="none" stroke="#4527A0" stroke-width="3"/><path d="M29 46v7M35 46v7" stroke="#D1C4E9" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="19" y="54" width="26" height="14" rx="2" fill="#B0BEC5"/><text x="32" y="63.5" text-anchor="middle" font-size="7.5" font-weight="800" font-family="monospace" fill="#5E35B1">&lt;/&gt;</text>`;
    top = `<g fill="none" stroke="#263238" stroke-width="1.4"><circle cx="28" cy="28.6" r="3.4"/><circle cx="36" cy="28.6" r="3.4"/><path d="M31.4 28.6h1.2"/></g>
      <path d="M19.5 29a12.5 12.5 0 0 1 25 0" fill="none" stroke="#263238" stroke-width="2.6"/><rect x="17" y="26.5" width="5" height="9" rx="2.5" fill="#263238"/><rect x="42" y="26.5" width="5" height="9" rx="2.5" fill="#263238"/>`;
  }
  return `<svg class="av" viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="32" cy="32" r="32"/></clipPath><clipPath id="${id}b"><path d="${BODY}"/></clipPath></defs>
    <g clip-path="url(#${id})"><rect width="64" height="64" fill="${P.bg}"/>${back}
    <path d="M28 37h8v6a4 4 0 0 1-8 0z" fill="#E3AC84"/><path d="${BODY}" fill="${P.body}"${white}/>${outfit}
    <circle cx="21.3" cy="29" r="2.4" fill="#E9B48C"/><circle cx="42.7" cy="29" r="2.4" fill="#E9B48C"/><circle cx="32" cy="28" r="11" fill="#F3C6A0"/>${front}
    <circle cx="28" cy="28.6" r="1.4" fill="#262626"/><circle cx="36" cy="28.6" r="1.4" fill="#262626"/><path d="M28.8 32.6q3.2 2.4 6.4 0" fill="none" stroke="#9A4A3A" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="25" cy="31.5" r="1.8" fill="#F28B82" opacity=".35"/><circle cx="39" cy="31.5" r="1.8" fill="#F28B82" opacity=".35"/>${top}</g></svg>`;
}

/* ============ son o'qi ============ */
const SUF = { [C.ink]: "k", [C.blue]: "b", [C.red]: "r", [C.green]: "g", [C.orange]: "o", [C.violet]: "v", [C.muted]: "m" };
function markers(id) {
  return Object.keys(SUF).map(col => `<marker id="${id}${SUF[col]}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker>`).join("");
}
/* cfg: min, max, tick, h, y, center{v,lab}, band{lo,hi,openLo,openHi,color,lab}, rays{lo,hi,open,color},
   dots[{v,color,hollow,lab}], arrows[{from,to,lab,color,lvl}], handle{v,color,lab}, marks[{v,txt,color}], extra(o) */
function NL(el, cfg) {
  const o = { el, cfg: Object.assign({ tick: 1, h: 96, pad: 24 }, cfg) };
  o.draw = p => { if (p) Object.assign(o.cfg, p); render(); return o; };
  function render() {
    const c = o.cfg, W = Math.max(260, Math.floor(el.clientWidth || 600)), H = c.h, y = c.y != null ? c.y : H - 36, pad = c.pad;
    const ppu = (W - 2 * pad) / (c.max - c.min), X = v => pad + (v - c.min) * ppu;
    o.X = X; o.V = px => c.min + (px - pad) / ppu; o.W = W; o.Y = y; o.ppu = ppu;
    const id = "n" + (++UID), su = col => SUF[col] || "k";
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="nl" role="img" aria-label="Son o'qi"><defs>${markers(id)}</defs>`;
    const marks = (c.marks || []).slice();
    if (c.band && c.band.lab !== false) { const col = c.band.color || C.green; marks.push({ v: c.band.lo, txt: fmt(c.band.lo), color: col }, { v: c.band.hi, txt: fmt(c.band.hi), color: col }); }
    if (c.rays && c.rays.lab !== false) { const col = c.rays.color || C.red; marks.push({ v: c.rays.lo, txt: fmt(c.rays.lo), color: col }, { v: c.rays.hi, txt: fmt(c.rays.hi), color: col }); }
    if (c.center && c.center.below !== false) marks.push({ v: c.center.v, txt: c.center.lab != null ? c.center.lab : fmt(c.center.v), color: C.orange });
    if (c.band) { const b = c.band; s += `<rect x="${X(b.lo)}" y="${y - 14}" width="${Math.max(0, X(b.hi) - X(b.lo))}" height="28" rx="6" fill="${b.color || C.green}" opacity="${b.fade ? .08 : .15}"/>`; }
    s += `<line x1="${pad - 14}" y1="${y}" x2="${W - pad + 14}" y2="${y}" stroke="${C.ink}" stroke-width="2" ${c.rays ? "" : `marker-end="url(#${id}k)"`}/>`;
    if (c.band) { const b = c.band, col = b.color || C.green; s += `<line x1="${X(b.lo)}" y1="${y}" x2="${X(b.hi)}" y2="${y}" stroke="${col}" stroke-width="6" opacity="${b.fade ? .45 : 1}"/>`; }
    if (c.rays) {
      const r = c.rays, col = r.color || C.red;
      const l0 = pad - 14, r0 = W - pad + 14;
      s += `<line x1="${X(r.lo)}" y1="${y}" x2="${l0 + 8}" y2="${y}" stroke="${col}" stroke-width="6"/><path d="M${l0} ${y}l11 -7v14z" fill="${col}"/>`;
      s += `<line x1="${X(r.hi)}" y1="${y}" x2="${r0 - 8}" y2="${y}" stroke="${col}" stroke-width="6"/><path d="M${r0} ${y}l-11 -7v14z" fill="${col}"/>`;
    }
    const nT = Math.round((c.max - c.min) / c.tick);
    const mult = [1, 2, 5, 10, 20, 50, 100].find(m => m * c.tick * ppu >= (c.gap || 40)) || 100;
    const unit = mult * c.tick;
    for (let i = 0; i <= nT; i++) {
      const v = r6(c.min + i * c.tick), x = X(v), q = v / unit, big = Math.abs(q - Math.round(q)) < 1e-6;
      s += `<line x1="${x}" y1="${y - (big ? 7 : 4)}" x2="${x}" y2="${y + (big ? 7 : 4)}" stroke="${C.muted}" stroke-width="1.3"/>`;
      if (big && !marks.some(m => Math.abs(X(m.v) - x) < 30)) s += `<text class="tl" x="${x}" y="${y + 24}">${fmt(v)}</text>`;
    }
    if (c.center) { const x = X(c.center.v); s += `<line x1="${x}" y1="${y - 16}" x2="${x}" y2="${y + 16}" stroke="${C.orange}" stroke-width="3.2" stroke-linecap="round"/>`; }
    marks.forEach(m => { s += `<text class="ml" x="${X(m.v)}" y="${y + 25}" fill="${m.color || C.ink}">${m.txt}</text>`; });
    const endDot = (v, col, open) => `<circle cx="${X(v)}" cy="${y}" r="6.5" fill="${open ? "#fff" : col}" stroke="${col}" stroke-width="3"/>`;
    if (c.band) { const b = c.band, col = b.color || C.green; s += endDot(b.lo, col, b.openLo) + endDot(b.hi, col, b.openHi); }
    if (c.rays) { const r = c.rays, col = r.color || C.red; s += endDot(r.lo, col, r.open !== false) + endDot(r.hi, col, r.open !== false); }
    (c.arrows || []).forEach(a => {
      const x1 = X(a.from), x2 = X(a.to), ya = y - 30 - (a.lvl || 0) * 18, col = a.color || C.blue;
      if (Math.abs(x2 - x1) < 3) return;
      s += `<line x1="${x1}" y1="${ya}" x2="${x2}" y2="${ya}" stroke="${col}" stroke-width="2.4" marker-end="url(#${id}${su(col)})"/>`;
      s += `<line x1="${x1}" y1="${ya - 5}" x2="${x1}" y2="${ya + 5}" stroke="${col}" stroke-width="2"/>`;
      s += `<line x1="${x2}" y1="${ya}" x2="${x2}" y2="${y - 9}" stroke="${col}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
      if (a.lab) s += `<text class="al" x="${(x1 + x2) / 2}" y="${ya - 6}" fill="${col}">${a.lab}</text>`;
    });
    const rows = [];
    (c.dots || []).map((d, i) => ({ d, i })).sort((p, q) => p.d.v - q.d.v).forEach(({ d, i }) => {
      const x = X(d.v), col = d.color || C.blue;
      s += `<circle cx="${x}" cy="${y}" r="${d.r || 7.5}" fill="${d.hollow ? "#fff" : col}" stroke="${d.hollow ? col : "#fff"}" stroke-width="${d.hollow ? 3 : 2}" data-i="${i}"/>`;
      if (d.lab && c.dotLab !== false) {
        let row = 0; while (rows[row] != null && x - rows[row] < 34) row++;
        rows[row] = x;
        s += `<text class="al" x="${x}" y="${y - 14 - row * 15}" fill="${col}">${d.lab}</text>`;
      }
    });
    if (c.handle) {
      const x = X(c.handle.v), col = c.handle.color || C.blue;
      s += `<circle cx="${x}" cy="${y}" r="20" fill="${col}" opacity=".16"/><circle cx="${x}" cy="${y}" r="11" fill="${col}" stroke="#fff" stroke-width="3"/>`;
      if (c.handle.lab) s += `<text class="ml" x="${x}" y="${y - 26}" fill="${col}">${c.handle.lab}</text>`;
    }
    if (c.extra) s += c.extra(o);
    s += "</svg>";
    el.innerHTML = s;
  }
  o.nearest = (px, list) => {
    let best = -1, bd = 1e9;
    (list || o.cfg.dots || []).forEach((d, i) => { const dd = Math.abs(o.X(d.v) - px); if (dd < bd) { bd = dd; best = i; } });
    return bd <= 26 ? best : -1;
  };
  LIVE.add(o);
  render();
  return o;
}
/* sudrash: px — element chap chetidan */
function drag(el, f) {
  let act = false;
  const px = e => e.clientX - el.getBoundingClientRect().left;
  el.addEventListener("pointerdown", e => {
    if (f.down && f.down(px(e), e) === false) return;
    act = true;
    try { el.setPointerCapture(e.pointerId); } catch (er) {}
    if (f.move) f.move(px(e), e);
    e.preventDefault();
  });
  el.addEventListener("pointermove", e => { if (act && f.move) f.move(px(e), e); });
  const end = () => { if (!act) return; act = false; if (f.up) f.up(); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ============ savol turlari ============ */
function fbSet(el, kind, html) { el.className = "fb " + kind; el.innerHTML = html || ""; }
/* yordam: xato yoki «Yordam» bosilsa — 1) ishora (o'qda ko'rsatiladi, h1), 2) aniq qadam (h2), 3) «Ko'rsatib ber» — o'zi yechib beradi.
   35 soniya javob bo'lmasa yoki 3 marta xato bo'lsa, tugma o'zi miltillab chaqiradi */
function helper(row, fbEl, o, solve) {
  let n = 0, miss = 0, done = false;
  const b = h(`<button class="btn help">Yordam</button>`);
  row.append(b);
  const txt = hf => (typeof hf === "function" ? hf() : hf) || "";
  const lab = () => { b.textContent = n >= 2 ? "Ko'rsatib ber" : "Yordam"; };
  const call = t => { if (done) return; if (t) b.textContent = t; b.classList.add("pulse"); };
  later(() => call(n >= 2 ? "Ko'rsatib ber" : "Yordam kerakmi?"), 35000);
  const up = () => { n = Math.min(n + 1, 2); if (n === 1 && !o.h1) n = 2; };
  b.onclick = () => {
    if (done) return;
    b.classList.remove("pulse");
    if (o.onWrong) o.onWrong();
    if (n >= 2) { const t = txt(o.h2); H.end(); solve(`<b>Yechim:</b> ${t}<br>`); return; }
    up();
    fbSet(fbEl, "hint", txt(n === 1 ? o.h1 : o.h2));
    lab();
  };
  const H = {
    wrong(extra) {
      up(); miss++;
      fbSet(fbEl, n === 1 ? "bad" : "hint", (extra ? extra + " " : (n === 1 ? "Hali emas. " : "")) + txt(n === 1 ? o.h1 : o.h2));
      lab(); if (miss >= 3) call("Ko'rsatib ber");
    },
    miss() { up(); miss++; lab(); if (miss >= 3) call("Ko'rsatib ber"); },
    end() { done = true; b.hidden = true; }
  };
  return H;
}
function goOn(box, next, label) {
  const r = h(`<div class="row"><button class="btn green pulse">${label || "Davom etish →"}</button></div>`);
  $("button", r).onclick = () => { r.remove(); next(); };
  box.append(r);
  return r;
}
function choice(box, o) {
  const el = h(`<div class="ask">${o.q ? `<p class="q">${o.q}</p>` : ""}<div class="opts"></div><div class="row"></div><div class="fb" aria-live="polite"></div></div>`);
  const opts = $(".opts", el), fbEl = $(".fb", el);
  let done = false;
  function win(b, pre) {

function tiles(box, o) {
  const el = h(`<div class="ask">${o.q ? `<p class="q">${o.q}</p>` : ""}<div class="tline"></div><div class="bank" aria-label="Kartochkalar"></div>
    <div class="row"><button class="btn chk" disabled>Tekshirish</button></div><div class="fb" aria-live="polite"></div></div>`);
  const line = $(".tline", el), bank = $(".bank", el), fbEl = $(".fb", el), chk = $(".chk", el);
  const slots = [];
  let done = false, tb = [], pre = "";
  const upd = () => { chk.disabled = done || slots.some(s => s.t < 0); };
  o.tpl.forEach(tok => {
    if (typeof tok === "number") {
      const b = h(`<button class="slot" aria-label="bo'sh joy"></button>`), s = { b, t: -1 };
      slots[tok] = s;
      b.onclick = () => { if (done || s.t < 0) return; tb[s.t].disabled = false; s.t = -1; b.textContent = ""; b.className = "slot"; upd(); };
      line.append(b);
    } else line.append(h(`<span class="tk">${tok}</span>`));
  });
  tb = o.tiles.map((t, i) => {
    const b = h(`<button class="tile">${t}</button>`);
    b.onclick = () => {
      if (done) return;
      const s = slots.find(z => z.t < 0); if (!s) return;
      s.t = i; s.b.textContent = t; s.b.className = "slot full"; b.disabled = true; upd();
    };
    bank.append(b);
    return b;
  });
  chk.onclick = () => {
    let all = true;
    slots.forEach((s, k) => { const g = o.tiles[s.t] === o.ans[k]; s.b.className = "slot " + (g ? "ok" : "bad"); if (!g) all = false; });
    if (all) { done = true; H.end(); tb.forEach(b => { b.disabled = true; }); upd(); fbSet(fbEl, "ok", pre + o.ok); if (o.onOk) o.onOk(); }
    else H.wrong();
  };
  const H = helper(chk.parentNode, fbEl, o, p => {
    pre = p;
    slots.forEach(z => { if (z.t >= 0) tb[z.t].disabled = false; z.t = -1; });
    o.ans.forEach((a, k) => { const i = o.tiles.findIndex((t, j) => t === a && !tb[j].disabled); slots[k].t = i; tb[i].disabled = true; slots[k].b.textContent = a; });
    chk.onclick();
  });
  box.append(el);
  return el;
}
/* tpl: "{0} ≤ t ≤ {1}", belgi tugmasi: "{s0}" */
function askNums(box, o) {
  const html = o.tpl.replace(/\{(s?)(\d)\}/g, (m, s, i) => s
    ? `<button class="sg" data-s="${i}" aria-label="belgini almashtirish">${(o.signs || ["≤", "<"])[0]}</button>`

  const fbEl = $(".fb", el), chk = $(".chk", el), signs = o.signs || ["≤", "<"];
  let done = false, pre = "";
  $$(".sg", el).forEach(b => { b.onclick = () => { if (done) return; b.textContent = signs[(signs.indexOf(b.textContent) + 1) % signs.length]; b.className = "sg"; }; });
  $$(".ni", el).forEach(inp => { inp.addEventListener("keydown", e => { if (e.key === "Enter") chk.click(); }); inp.addEventListener("input", () => { inp.className = "ni"; }); });
  chk.onclick = () => {

    let all = true;
    ins.forEach(i => { const g = same(num(i.value), o.ans[+i.dataset.i]); i.className = "ni " + (g ? "ok" : "bad"); if (!g) all = false; });
    $$(".sg", el).forEach(b => { const g = b.textContent === o.sans[+b.dataset.s]; b.className = "sg " + (g ? "ok" : "bad"); if (!g) all = false; });
    if (all) { done = true; H.end(); chk.disabled = true; ins.forEach(i => { i.readOnly = true; }); fbSet(fbEl, "ok", pre + o.ok); if (o.onOk) o.onOk(); }
    else H.wrong();
  };
  const H = helper(chk.parentNode, fbEl, o, p => {
    pre = p;
    $$(".ni", el).forEach(i => { i.value = fmt(o.ans[+i.dataset.i]); });
    $$(".sg", el).forEach(b => { b.textContent = o.sans[+b.dataset.s]; });

  });
  box.append(el);
  return el;
}
/* bir nechta holat: ha / yo'q */
function judge(box, o) {
  const el = h(`<div class="judge">${o.q ? `<p class="q">${o.q}</p>` : ""}</div>`);
  let left = o.items.length;
  const rows = [];
  o.items.forEach(it => {
    const r = h(`<div class="jrow"><div class="jq">${it.html}</div><div class="jbtn"><button class="btn green" data-v="1">${o.yes}</button><button class="btn red" data-v="0">${o.no}</button></div><div class="fb" aria-live="polite"></div></div>`);
    const fbEl = $(".fb", r);
    $$("button", r).forEach(b => {
      b.onclick = () => {
        const v = b.dataset.v === "1";
        if (v === it.good) {
          $$("button", r).forEach(x => { x.disabled = true; x.style.opacity = x === b ? "1" : ".3"; });
          fbSet(fbEl, "ok", it.why);
          if (o.onPick) o.onPick(it);
          if (--left === 0 && o.onDone) o.onDone();
        } else { b.disabled = true; fbSet(fbEl, "bad", it.bad || it.why); }
      };
    });
    rows.push({ r, it, fbEl, n: 0 });
    el.append(r);
  });
  /* yordam: navbatdagi javobsiz qatorga — avval ishora, keyin o'zi javob beradi */
  const hr = h(`<div class="row"><button class="btn help">Yordam</button></div>`), hb = $("button", hr);
  hb.onclick = () => {
    hb.classList.remove("pulse");
    const q = rows.find(z => $$(".btn", z.r).some(x => !x.disabled));
    if (!q) return;
    if (q.n === 0) { q.n = 1; fbSet(q.fbEl, "hint", (q.it.bad || "").replace(/^Hali emas\. /, "")); hb.textContent = "Ko'rsatib ber"; scrollToEl(q.r); return; }
    $(`[data-v="${q.it.good ? 1 : 0}"]`, q.r).onclick();
    hb.textContent = "Yordam";
    if (left === 0) hr.remove();
  };
  el.append(hr);
  later(() => { if (left > 0) { hb.textContent = "Yordam kerakmi?"; hb.classList.add("pulse"); } }, 35000);
  box.append(el);
  return el;
}

/* ============ formula paneli — ish bilan birga |x − a| ≤ d ============ */
/* c: v — harf, u — birlik, a, d, s ("≤" "<" ">"), lv/la/ld — x, a, d nimani bildiradi, yes/no — shart bajarilsa/bajarilmasa;
   hide ["a","s","d","eq"] — o'quvchi hali topmagan qismlar «?»; lo/hi — oraliq chetlari (to'g'nog'ichlardan); and — ikkinchi shart; raw — tayyor matn */
const F = {
  el: null, c: { hide: [] }, n: null,
  set(c) { this.c = Object.assign({ hide: [] }, c); this.n = null; this.draw(); },
  upd(p) { Object.assign(this.c, p); this.draw(); },
  open() { this.c.hide = []; this.c.lo = this.c.hi = null; this.draw(); },
  now(x, show, y) { this.n = x == null ? null : { x, show, y }; this.draw(); },
  say(html) { this.n = { html }; this.draw(); },
  draw() {
    const el = this.el, c = this.c, n = this.n;
    if (!el || !el.isConnected) return;
    const hid = k => c.hide.indexOf(k) >= 0, Q = `<span class="hole">?</span>`, V = q => `<i class="cb">${q.v}</i>`;
    const form = (q, top) => {
      const ha = top && hid("a"), a = ha ? Q : `<span class="co">${fmt(Math.abs(q.a))}</span>`;
      const inner = !ha && same(q.a, 0) ? V(q) : `${V(q)} ${!ha && q.a < 0 ? "+" : M} ${a}`;
      return `|${inner}| ${top && hid("s") ? Q : q.s} ${top && hid("d") ? Q : `<span class="cg">${fmt(q.d)}</span>`}`;
    };
    const eq = (q, top) => {
      if (top && hid("eq")) return Q;
      const lo = top && c.lo != null ? c.lo : q.a - q.d, hi = top && c.hi != null ? c.hi : q.a + q.d, col = q.s === ">" ? "cr" : "cg";
      const L = `<span class="${col}">${fmt(lo)}</span>`, R = `<span class="${col}">${fmt(hi)}</span>`;
      return q.s === ">" ? `${V(q)} < ${L} <span class="fo">yoki</span> ${V(q)} > ${R}` : `${L} ${q.s} ${V(q)} ${q.s} ${R}`;
    };
    let nw = "";
    if (n && n.html) nw = `<div class="fn">${n.html}</div>`;
    else if (n) {
      const qs = c.and ? [c, c.and] : [c];
      const rs = qs.map(q => {
        const x = q === c ? n.x : n.y, r = r6(x - q.a), d = dist(x, q.a);
        const inner = same(q.a, 0) ? fmt(x) : `${fmt(x)} ${q.a < 0 ? "+" : M} ${fmt(Math.abs(q.a))}`;
        const head = `|${inner}| = ` + (r < 0 && !same(q.a, 0) ? `|${fmt(r)}| = ` : "");
        if (!n.show) return { t: head + Q };
        const rel = same(d, q.d) ? "=" : d < q.d ? "<" : ">";
        return { t: head + (rel === "=" ? `${fmt(d)} — chegarada` : `${fmt(d)} ${rel} ${fmt(q.d)}`), ok: q.s === "≤" ? rel !== ">" : q.s === "<" ? rel === "<" : rel === ">" };
      });
      const cond = rs.every(r => r.ok), good = c.s === ">" ? !cond : cond;
      nw = `<div class="fn"><small>${qs.map(q => `${q.v} = ${fmt(q === c ? n.x : n.y)}${c.u || ""}`).join(", ")}</small>${rs.map(r => `<div>${r.t}</div>`).join("")}` +
        (n.show ? `<span class="fr ${good ? "ok" : "bad"}">${good ? "✓" : "✗"} ${cond ? c.yes : c.no}</span>` : "") + `</div>`;
    }
    const leg = [[V(c), c.lv], [hid("a") ? Q : `<span class="co">${fmt(c.a)}</span>`, c.la], [hid("d") ? Q : `<span class="cg">${fmt(c.d)}</span>`, c.ld]];
    if (c.and) leg.push([V(c.and), c.and.lv]);
    el.innerHTML = `<h3>Formulasi</h3>
      <div class="ff${c.raw ? " cr" : ""}">${c.raw ? c.raw.f : form(c, true)}</div>${c.and ? `<div class="fo">va</div><div class="ff">${form(c.and)}</div>` : ""}
      <div class="fe">⇔ ${c.raw ? c.raw.eq : eq(c, true)}${c.and ? `<br>⇔ ${eq(c.and)}` : ""}</div>
      ${c.raw ? `<p class="fnote">${c.raw.note}</p>` : `<div class="fl">${leg.map(([k, t]) => `<span><b>${k}</b> — ${t}</span>`).join("")}</div>`}${nw}`;
  }
};

/* L: nl — son o'qi, art(box, V) — kasb buyumi, steps [{t — qadam matni, go(V) — chizmadagi harakat}], onEnd */
function lstepper(box, L) {
  const el = h(`<div class="lex">
    <div class="lvis"><div class="lart"></div><div class="nlbox"></div><div class="lnow" aria-live="polite"></div></div>
    <div class="lsteps"><ol class="lol"></ol><div class="row"><button class="btn green pulse lnx">1-qadam →</button><button class="btn ghost lauto">▶ O'zi ko'rsatsin</button><button class="btn ghost sm lprev" hidden>← Orqaga</button><button class="btn ghost sm lre" hidden>↺ Qaytadan</button></div></div></div>`);
  box.append(el);
  const st = { dots: [], arrows: [], fx: [] };
  st.extra = o => st.fx.map(f => f(o)).join("");
  const nl = NL($(".nlbox", el), Object.assign({}, L.nl, st));
  const RUN = [], nowEl = $(".lnow", el);
  let fast = false;
  const V = {
    st, nl,
    d() { nl.draw(st); },
    now(html) { nowEl.innerHTML = html; nowEl.classList.remove("flash"); void nowEl.offsetWidth; nowEl.classList.add("flash"); },
    anim(ms, fn, done) {
      const a = { on: true };
      a.fin = () => { if (!a.on) return; a.on = false; fn(1); if (done) done(); };
      RUN.push(a);
      let t0 = 0;
      const tick = t => { if (!a.on) return; if (!t0) t0 = t; const p = RM || fast ? 1 : Math.min(1, (t - t0) / ms); if (p >= 1) { a.fin(); return; } fn(1 - Math.pow(1 - p, 3)); requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
      onLeave(() => { a.on = false; });
    },
    flush() { while (RUN.length) RUN.splice(0).forEach(a => a.fin()); },
    ping(v, col) {
      const f = o => `<circle cx="${o.X(v)}" cy="${o.Y}" r="${8 + 20 * f.k}" fill="none" stroke="${col}" stroke-width="3" opacity="${1 - f.k}"/>`;
      f.k = 0; st.fx.push(f);
      V.anim(700, k => { f.k = k; V.d(); }, () => { st.fx = st.fx.filter(g => g !== f); V.d(); });
    },
    dot(v, col, lab, quiet) { st.dots.push({ v, color: col, lab: lab || "" }); V.d(); if (!quiet) V.ping(v, col); return st.dots.length - 1; },
    arr(list) { V.anim(700, k => { st.arrows = list.map(a => Object.assign({}, a, { to: a.from + (a.to - a.from) * k, lab: k < 1 ? "" : a.lab })); V.d(); }); },
    band(lo0, hi0, lo1, hi1, more) {
      V.anim(800, k => { st.band = Object.assign({}, more, { lo: lo0 + (lo1 - lo0) * k, hi: hi0 + (hi1 - hi0) * k }, k < 1 ? { lab: false } : {}); V.d(); });
    },
    drop(v, col, lab, done) {
      const f = o => `<path d="${STAR}" transform="translate(${o.X(v)} ${8 + (o.Y - 8) * f.k})" fill="#F2B705" stroke="#B7791F" stroke-width="1.2"/>`;
      f.k = 0; st.fx.push(f);
      V.anim(900, k => { f.k = k; V.d(); }, () => { st.fx = st.fx.filter(g => g !== f); V.dot(v, col, lab); if (done) done(); });
    }
  };
  V.art = L.art ? L.art($(".lart", el), V) : {};
  V.d();
  const ol = $(".lol", el), nx = $(".lnx", el), au = $(".lauto", el), pv = $(".lprev", el), re = $(".lre", el);
  let i = 0, auto = false, T = 0;
  pv.onclick = () => { stop(); L.reopen(i - 1); };
  re.onclick = () => { stop(); L.reopen(0); };
  function step() {
    V.flush();
    const s = L.steps[i];
    $$("li", ol).forEach(li => li.classList.remove("cur"));
    ol.append(h(`<li class="cur"><i>${i + 1}</i><div>${s.t}</div></li>`));
    s.go(V);
    i++;
    pv.hidden = re.hidden = false;
    if (i < L.steps.length) { nx.textContent = `${i + 1}-qadam →`; if (auto) T = later(step, 3800); }
    else { nx.hidden = au.hidden = pv.hidden = re.hidden = true; auto = false; if (L.onEnd) later(() => { V.flush(); L.onEnd(); }, RM || fast ? 0 : 900); }
  }
  function stop() { auto = false; clearTimeout(T); au.textContent = "▶ O'zi ko'rsatsin"; }
  nx.onclick = () => { stop(); nx.classList.remove("pulse"); step(); };
  if (L.start > 0) { fast = true; for (let k = 0; k < L.start; k++) step(); V.flush(); fast = false; nx.classList.remove("pulse"); }
  au.onclick = () => { if (auto) { stop(); return; } auto = true; nx.classList.remove("pulse"); au.textContent = "⏸ To'xtat"; step(); };
}

    },
    steps: [
      { t: `Dizayner savatni chizdi: chap cheti <b class="cg">${M}5</b>, o'ng cheti <b class="cg">5</b>. O'rtasi: ${tx(`a = (${M}5 + 5) : 2 = 0`)}.`,
        go: V => { V.st.center = { v: 0 }; V.band(0, 0, -5, 5); V.now(`a = (${M}5 + 5) : 2 = <span class="co">0</span>`); } },
      { t: `O'rtadan chetigacha: ${tx(`d = 5 ${M} 0 = 5`)}.`,
        go: V => { V.arr([{ from: 0, to: 5, lab: "5", color: C.green, lvl: 1 }, { from: 0, to: -5, lab: "5", color: C.green, lvl: 1 }]); V.now(`d = 5 ${M} 0 = <span class="cg">5</span>`); } },
      { t: `Kod qatori: ${tx(`|x ${M} 0| ≤ 5`)}. x ${M} 0 = x bo'lgani uchun qisqa yoziladi: ${tx("|x| ≤ 5")}.`,
        go: V => { V.art.type(`|x ${M} 0| ≤ 5`, () => later(() => V.art.type("|x| ≤ 5"), RM ? 0 : 700)); V.now(`|x| ≤ 5 ⇔ <span class="cg">${M}5 ≤ x ≤ 5</span>`); } },
      { t: `Yulduz <b class="cb">x = ${M}3</b> ga tushdi. ${tx(`|${M}3| = 3`)}, 3 ≤ 5 — <b>ushladi!</b>`,
        go: V => { V.st.arrows = []; V.d(); V.drop(-3, C.green, `${M}3`); V.now(`|${M}3| = 3 ≤ 5 ${bOk("ushladi")}`); } },
      { t: `Keyingisi <b class="cb">x = 6,5</b> ga tushdi. ${tx("|6,5| = 6,5")}, 6,5 > 5 — <b>o'tib ketdi</b>.`,
        go: V => { V.drop(6.5, C.red, "6,5"); V.now(`|6,5| = 6,5 > 5 ${bNo("o'tib ketdi")}`); } },
      { t: `Yangi darajada savat o'ngga surildi: 3 dan 13 gacha. O'rtasi endi 8, d o'zgarmadi: ${tx(`|x ${M} 8| ≤ 5`)}. Endi 6,5 ushlanadi: ${tx(`|6,5 ${M} 8| = 1,5 ≤ 5`)}. ${M}3 esa savatdan tashqarida qoldi.`,
        go: V => {
          V.anim(1100, k => { V.st.center = { v: 8 * k }; V.st.band = Object.assign({ lo: -5 + 8 * k, hi: 5 + 8 * k }, k < 1 ? { lab: false } : {}); V.d(); }, () => {
            V.st.dots[0].color = C.red; V.st.dots[1].color = C.green; V.d();
          });
          V.art.type(`|x ${M} 8| ≤ 5`);
          V.now(`|6,5 ${M} 8| = 1,5 ≤ 5 ${bOk("ushladi")}`);
        } }
    ],
    sum: `Savat ${tx(`a ${M} d`)} dan ${tx("a + d")} gacha ushlaydi: ${tx(`|x ${M} a| ≤ d`)}.<br>O'rtasi 0 bo'lsa — qisqa yoziladi: ${tx("|x| ≤ d")}.`
  }
};

SCREENS.lec = at => {
  const el = h(`<section class="panel">
    <div class="shead"><h2>Kasb egalari modulni qanday ishlatadi?</h2><span class="count" id="l-count"></span></div>
    <p class="hint">Har kasbda bitta misol qadamma-qadam ishlanadi. Keyin o'zingiz kasb egasining shogirdi bo'lib ishlaysiz.</p>
    <div class="rule">${rx(`|x ${M} a|`)} — ${lx("x")} bilan ${lx("a")} orasidagi masofa.<br>
      ${rx(`|x ${M} a| ≤ d`)} ⇔ ${rx(`a ${M} d ≤ x ≤ a + d`)} — ${lx("x")} son ${lx("a")} dan ko'pi bilan ${lx("d")} ga farq qiladi.<br>
      ${rx(`|x ${M} a| > d`)} ⇔ ${rx(`x < a ${M} d`)} yoki ${rx("x > a + d")} — farq ${lx("d")} dan katta.</div>
    <div class="ltabs" role="tablist">${LORDER.map((k, i) => `<button class="ltab" role="tab" data-i="${i}">${avatar(k, 34)}<span>${KASB[k].short || KASB[k].name}</span></button>`).join("")}</div>
    <div class="lsec sbox"></div>
    <div class="lgo"><span class="lgo-av">${ORDER.map(k => avatar(k, 40)).join("")}</span><div><b>Interaktiv dars</b><span>Shifokor, quruvchi va oshpazning shogirdi bo'lib, o'zingiz ishlaysiz.</span></div><button class="btn green" id="l-skip">Interaktiv dars →</button></div>
  </section>`);
  scr.append(el);
  const sec = $(".lsec", el);
  $("#l-skip", el).onclick = () => show("pick");
  function tabs(cur) {
    $$(".ltab", el).forEach((b, i) => { b.setAttribute("aria-selected", i === cur ? "true" : "false"); b.classList.toggle("done", S.ls.indexOf(LORDER[i]) >= 0); });
  }
  $$(".ltab", el).forEach(b => { b.onclick = () => open(+b.dataset.i); });
  function open(i, start) {
    leaveAll();
    tabs(i);
    const k = LORDER[i], K = KASB[k], L = LEC[k], last = i === LORDER.length - 1;
    $("#l-count", el).textContent = `${i + 1} / ${LORDER.length}`;
    sec.innerHTML = "";
    const sc = h(`<div class="scene"><div class="scimg"></div><div class="sctx"><small class="ltag">${K.name} · ${K.tag}</small><b>${L.scene[0]}</b><p>${L.scene[1]}</p></div></div>`);
    sec.append(sc);
    sceneImg($(".scimg", sc), k);
    sec.append(h(`<div class="bubble">${avatar(k, 48)}<div class="btext"><small>${K.who}</small><p>${L.say}</p></div></div>`));
    lstepper(sec, Object.assign({}, L, {
      start: start || 0,
      reopen: n => open(i, n),
      onEnd: () => {
        if (S.ls.indexOf(k) < 0) { S.ls.push(k); save(); tabs(i); }
        const d = h(`<div class="sbox"><div class="rule">${L.sum}</div>
          <div class="row"><button class="btn green pulse l-next">${last ? "Interaktiv dars →" : `Keyingi: ${KASB[LORDER[i + 1]].name} →`}</button><button class="btn ghost l-prev">← Orqaga</button><button class="btn ghost l-re">↺ Qaytadan</button></div></div>`);
        $(".l-next", d).onclick = () => { if (last) show("pick"); else { open(i + 1); scrollToEl(el); } };
        $(".l-re", d).onclick = () => open(i);
        $(".l-prev", d).onclick = () => open(i, L.steps.length - 1);
        sec.append(d);
        later(() => scrollToEl(d), 60);
      }
    }));
  }
  open(at != null ? at : Math.max(0, LORDER.findIndex(k => S.ls.indexOf(k) < 0)));
};

/* ---- boshlash ---- */
let FIRST = true;
const _show = show;
show = function (name, a, b) { if (FIRST) { FIRST = false; leaveAll(); scr.innerHTML = ""; SCREENS[name](a, b); post(); return; } _show(name, a, b); };
show("lec");
</script>
</body>
