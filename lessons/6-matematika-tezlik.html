<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tezlik</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f6f7fb; color:#1f2433; display:flex; flex-direction:column; align-items:center; padding:28px; min-height:100vh; gap:16px; }
  .panel { background:#fff; border-radius:16px; padding:26px; box-shadow:0 4px 16px rgba(31,36,51,.08); max-width:520px; width:100%; text-align:center; }
  h2 { margin:0 0 4px; font-size:1.1rem; }
  .hint { color:#6b7280; font-size:.85rem; margin-bottom:18px; }
  svg { display:block; margin:0 auto 12px; }
  input[type=range] { width:100%; margin-bottom:14px; }
  .readouts { display:flex; justify-content:space-around; margin-bottom:10px; }
  .readout .label { font-size:.72rem; font-weight:700; color:#6b7280; text-transform:uppercase; }
  .readout .value { font-size:1.15rem; font-weight:800; }
  .readout.a .value { color:#4f5bd5; }
  .readout.b .value { color:#16a394; }
  .status { font-weight:700; margin-top:8px; min-height:22px; color:#16a394; }
  .btn { margin-top:10px; padding:10px 20px; font-weight:700; font-family:inherit; font-size:.85rem; color:#3a44b0; background:#eef0fb; border:none; border-radius:10px; cursor:pointer; }
  .btn:hover { background:#e0e3f9; }
</style>
</head>
<body>

<div class="panel">
  <h2>Harakat chizig'i</h2>
  <div class="hint" id="hint"></div>
  <svg id="line-svg" width="320" height="90" viewBox="0 0 320 90"></svg>
  <input type="range" id="hour-slider" min="0" max="5" value="0" step="0.1">
  <div class="readouts">
    <div class="readout a"><div class="label">A</div><div class="value" id="a-pos">0 km</div></div>
    <div class="readout"><div class="label">Soat</div><div class="value" id="hour-value">0</div></div>
    <div class="readout b"><div class="label">B</div><div class="value" id="b-pos">0 km</div></div>
  </div>
  <div class="status" id="status"></div>
  <button class="btn" id="next-btn">Yangi masala →</button>
</div>

<script>
const SCENES = [
  { roadLength: 100, maxHours: 5, a: { start: 0, speed: 20, dir: 1 }, b: { start: 100, speed: 30, dir: -1 }, label: "A shahardan chiqqan avtobus, B qarshi tomondan kelayotgan yengil mashina" },
  { roadLength: 60, maxHours: 4, a: { start: 0, speed: 15, dir: 1 }, b: { start: 60, speed: 15, dir: -1 }, label: "Ikki velosipedchi bir-biriga qarab harakatlanmoqda" },
  { roadLength: 180, maxHours: 6, a: { start: 0, speed: 25, dir: 1 }, b: { start: 180, speed: 35, dir: -1 }, label: "Ikkita poyezd bir-biriga qarab yo'lga chiqdi" }
];

let idx = 0;
const svg = document.getElementById("line-svg");
const slider = document.getElementById("hour-slider");

function positionAt(runner, hour) {
  return runner.start + runner.dir * runner.speed * hour;
}

function render() {
  const scene = SCENES[idx];
  slider.max = scene.maxHours;
  slider.value = 0;
  document.getElementById("hint").textContent = scene.label + ". Slayderni suring va ular qachon uchrashishini toping.";
  update();
}

function update() {
  const scene = SCENES[idx];
  const hour = Number(slider.value);
  const scale = 280 / scene.roadLength;
  const posA = Math.max(0, Math.min(scene.roadLength, positionAt(scene.a, hour)));
  const posB = Math.max(0, Math.min(scene.roadLength, positionAt(scene.b, hour)));
  const dist = Math.abs(posA - posB);

  svg.innerHTML =
    '<line x1="20" y1="45" x2="300" y2="45" stroke="#e5e7f0" stroke-width="4"/>' +
    '<text x="20" y="70" font-size="11" fill="#6b7280">0 km</text>' +
    '<text x="270" y="70" font-size="11" fill="#6b7280" text-anchor="end">' + scene.roadLength + ' km</text>' +
    '<circle cx="' + (20 + posA * scale) + '" cy="45" r="9" fill="#4f5bd5"/>' +
    '<circle cx="' + (20 + posB * scale) + '" cy="45" r="9" fill="#16a394"/>';

  document.getElementById("hour-value").textContent = hour.toFixed(1);
  document.getElementById("a-pos").textContent = Math.round(posA) + " km";
  document.getElementById("b-pos").textContent = Math.round(posB) + " km";

  const statusEl = document.getElementById("status");
  statusEl.textContent = dist < 1 ? "Bu yerda uchrashishadi! \u{1F389} (taxminan " + hour.toFixed(1) + " soat)" : "Orasidagi masofa: " + Math.round(dist) + " km";
}

slider.addEventListener("input", update);
document.getElementById("next-btn").addEventListener("click", function () {
  idx = (idx + 1) % SCENES.length;
  render();
});

render();
</script>
</body>
</html>
