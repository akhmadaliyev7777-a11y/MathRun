<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natural sonlar va shkalalar</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f6f7fb; color:#1f2433; display:flex; flex-direction:column; align-items:center; padding:28px; min-height:100vh; gap:16px; }
  .panel { background:#fff; border-radius:16px; padding:26px; box-shadow:0 4px 16px rgba(31,36,51,.08); max-width:520px; width:100%; text-align:center; }
  h2 { margin:0 0 4px; font-size:1.1rem; }
  .hint { color:#6b7280; font-size:.85rem; margin-bottom:20px; }
  .target { font-size:1rem; color:#6b7280; margin-bottom:18px; }
  .target b { color:#1f2433; font-size:1.3rem; }
  .columns { display:flex; justify-content:center; gap:14px; margin-bottom:18px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .col-label { font-size:.72rem; font-weight:700; color:#6b7280; text-transform:uppercase; }
  .stepper { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .stepper button { width:36px; height:36px; border-radius:8px; border:none; background:#eef0fb; color:#3a44b0; font-size:1.1rem; font-weight:700; cursor:pointer; }
  .stepper button:hover { background:#e0e3f9; }
  .stepper .count { font-size:1.3rem; font-weight:800; }
  .total { font-size:1.1rem; font-weight:700; margin-top:8px; }
  .total.match { color:#16a394; }
  .btn { margin-top:16px; padding:10px 20px; font-weight:700; font-family:inherit; font-size:.85rem; color:#3a44b0; background:#eef0fb; border:none; border-radius:10px; cursor:pointer; }
  .btn:hover { background:#e0e3f9; }
</style>
</head>
<body>

<div class="panel">
  <h2>Sonni qurish</h2>
  <div class="hint">Minglik, yuzlik, o'nlik, birlik bloklarini +/- bilan sozlab, berilgan sonni quring</div>
  <div class="target">Maqsad son: <b id="target-value"></b></div>

  <div class="columns" id="columns"></div>

  <div class="total" id="total"></div>
  <button class="btn" id="next-btn">Yangi son →</button>
</div>

<script>
const TARGETS = [342, 1234, 5006, 2790, 4321];
const PLACES = [
  { key: "thousands", label: "Minglik", mult: 1000 },
  { key: "hundreds", label: "Yuzlik", mult: 100 },
  { key: "tens", label: "O'nlik", mult: 10 },
  { key: "units", label: "Birlik", mult: 1 }
];

let idx = 0;
let counts = { thousands: 0, hundreds: 0, tens: 0, units: 0 };

function render() {
  counts = { thousands: 0, hundreds: 0, tens: 0, units: 0 };
  document.getElementById("target-value").textContent = TARGETS[idx];
  renderColumns();
  updateTotal();
}

function renderColumns() {
  document.getElementById("columns").innerHTML = PLACES.map(function (p) {
    return (
      '<div class="col">' +
        '<div class="col-label">' + p.label + '</div>' +
        '<div class="stepper">' +
          '<button data-key="' + p.key + '" data-d="1">+</button>' +
          '<div class="count" id="count-' + p.key + '">' + counts[p.key] + '</div>' +
          '<button data-key="' + p.key + '" data-d="-1">−</button>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  document.querySelectorAll(".stepper button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const key = btn.dataset.key;
      const d = Number(btn.dataset.d);
      counts[key] = Math.max(0, Math.min(9, counts[key] + d));
      document.getElementById("count-" + key).textContent = counts[key];
      updateTotal();
    });
  });
}

function updateTotal() {
  const total = PLACES.reduce(function (sum, p) { return sum + counts[p.key] * p.mult; }, 0);
  const el = document.getElementById("total");
  const match = total === TARGETS[idx];
  el.textContent = "Sizning soningiz: " + total + (match ? "  ✓ Mos keldi!" : "");
  el.className = "total" + (match ? " match" : "");
}

document.getElementById("next-btn").addEventListener("click", function () {
  idx = (idx + 1) % TARGETS.length;
  render();
});

render();
</script>
</body>
</html>
