# «Biz haqimizda» sahifasidagi raqamlarni har 3 kunda yangilaydi (o'zgarish bo'lsagina commit qiladi)
name: Raqamlarni yangilash

on:
  schedule:
    - cron: "0 1 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  raqamlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/raqamlar.js
      - name: O'zgargan bo'lsa saqlash
        run: |
          if git diff --quiet -- js/raqamlar.json && git ls-files --error-unmatch js/raqamlar.json >/dev/null 2>&1; then
            echo "O'zgarish yo'q"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/raqamlar.json
          git commit -m "Raqamlar yangilandi (avtomatik, 3 kunda bir)"
          git push
